<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 할 일</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="todo-container">
        <header>
            <h1>오늘의 할 일</h1>
        </header>
        
        <form class="todo-form">
            <input type="text" class="todo-input" placeholder="할 일을 입력하세요" required maxlength="30">
            <button type="submit" class="todo-button">추가</button>
        </form>

        <section class="todo-list-section">
            <ul class="todo-list"></ul>
        </section>

        <footer>
            <span class="todo-count">0개 항목 남음</span>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
