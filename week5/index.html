<!DOCTYPE html>

<head>

    <title>스도쿠</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-container">
        <header>
            <h1>🧩 오늘의 스도쿠</h1>

        </section>
    </main>

    <script src="script.js"></script>
