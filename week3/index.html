<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator-container">
        <section class="calculator">
            <div class="display">
                <span class="result">0</span>
            </div>

            <form class="button-grid">
                <button type="button" class="btn btn-func">AC</button>
                <button type="button" class="btn btn-func">+/-</button>
                <button type="button" class="btn btn-func">%</button>
                <button type="button" class="btn btn-operator">÷</button>

                <button type="button" class="btn">7</button>
                <button type="button" class="btn">8</button>
                <button type="button" class="btn">9</button>
                <button type="button" class="btn btn-operator">×</button>

                <button type="button" class="btn">4</button>
                <button type="button" class="btn">5</button>
                <button type="button" class="btn">6</button>
                <button type="button" class="btn btn-operator">-</button>

                <button type="button" class="btn">1</button>
                <button type="button" class="btn">2</button>
                <button type="button" class="btn">3</button>
                <button type="button" class="btn btn-operator">+</button>

                <button type="button" class="btn btn-zero">0</button>
                <button type="button" class="btn">.</button>
                <button type="button" class="btn btn-operator">=</button>
            </form>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
